<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check Rut Pro - V2.0 PRIVADO</title>
    <style>
        :root {
            --primary-green: #1b4314;
            --tabs-blue: #1976d2;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #448aff;
            --report-red: #ef5350;
            --report-green: #66bb6a;
            --text-gray: #aaa;
            --modal-bg: #2c2c2c;
        }

        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: white; overflow-x: hidden; }
        
        .nav-tabs { display: flex; background-color: var(--tabs-blue); position: sticky; top: 0; z-index: 100; overflow-x: auto; }
        .tab { flex: 1; min-width: 75px; padding: 15px 0; text-align: center; font-size: 0.65rem; font-weight: bold; color: rgba(255,255,255,0.6); cursor: pointer; text-transform: uppercase; border-bottom: 4px solid transparent; white-space: nowrap; transition: 0.2s; }
        .tab.active { color: white; border-bottom: 4px solid #fff; background: rgba(255,255,255,0.1); }

        .section { display: none; padding: 15px; min-height: 80vh; padding-bottom: 100px; }
        .section.active { display: block; }

        .notepad-container { background: #000; border-radius: 12px; padding: 15px; border: 1px solid #333; min-height: 250px; margin-top: 10px; white-space: pre-wrap; font-family: monospace; color: #00ff00; font-size: 0.95rem; }
        .btn-edit-note { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 10px; width: 100%; font-weight: bold; }

        .timer-card { background: var(--card-bg); margin-bottom: 15px; padding: 20px; border-radius: 15px; border: 3px solid #333; display: flex; flex-direction: column; position: relative; }
        .timer-route { font-size: 1.6rem; font-weight: bold; }
        .timer-elapsed { font-size: 1.2rem; color: var(--accent-blue); font-weight: 600; }
        .unit-tag { padding: 6px 15px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; color: white; margin-top: 10px; display: inline-block; }
        .tag-combi { background: var(--accent-blue); }
        .tag-camion { background: var(--report-red); }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--accent-blue); border-radius: 50%; border: none; color: white; font-size: 35px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 200; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--modal-bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
        .btn-action { background: var(--accent-blue); border: none; color: white; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 15px; }
        select, input, textarea { width: 100%; background: #2a2a2a; border: 1px solid #444; color: white; padding: 14px; border-radius: 10px; margin-bottom: 10px; font-size: 1rem; box-sizing: border-box; }
    </style>
</head>
<body>

    <nav class="nav-tabs">
        <div class="tab active" id="tab-llamar" onclick="switchTab('llamar')">📞 CONTACTOS</div>
        <div class="tab" id="tab-base" onclick="switchTab('base')">📋 SALIDAS</div>
        <div class="tab" id="tab-rutas" onclick="switchTab('rutas')">🗺️ RUTAS</div>
        <div class="tab" id="tab-horarios" onclick="switchTab('horarios')">🕒 TIEMPOS</div>
        <div class="tab" id="tab-reportes" onclick="switchTab('reportes')">📊 DIARIO</div>
    </nav>

    <div id="base" class="section active">
        <button class="btn-edit-note" onclick="checkPinForEdit()">🔒 CONFIGURAR / EDITAR SERVIDOR</button>
        <div id="noteDisplay" class="notepad-container">Configura tu Token para empezar...</div>
    </div>

    <div class="modal-overlay" id="editNoteModal">
        <div class="modal-content">
            <h3>Mi Servidor Privado</h3>
            <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)" style="font-size:0.8rem;">
            <input type="text" id="gistId" placeholder="ID del Gist">
            <hr>
            <textarea id="noteInput" rows="8" placeholder="Escribe las salidas aquí..."></textarea>
            <button class="btn-action" onclick="saveToMyServer()">GUARDAR EN MI SERVIDOR</button>
            <button onclick="closeModal('editNoteModal')" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <script>
        const PIN_SEGURIDAD = "1234";

        window.onload = () => {
            document.getElementById('ghToken').value = localStorage.getItem('my_gh_token') || "";
            document.getElementById('gistId').value = localStorage.getItem('my_gist_id') || "";
            loadFromMyServer();
        };

        async function loadFromMyServer() {
            const token = localStorage.getItem('my_gh_token');
            const id = localStorage.getItem('my_gist_id');
            if(!token || !id) return;

            try {
                const res = await fetch(`https://api.github.com/gists/${id}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                const data = await res.json();
                const contenido = data.files["salidas.txt"].content;
                document.getElementById('noteDisplay').innerText = contenido;
                document.getElementById('noteInput').value = contenido;
            } catch (e) { console.error(e); }
        }

        async function saveToMyServer() {
            const token = document.getElementById('ghToken').value;
            const id = document.getElementById('gistId').value;
            const text = document.getElementById('noteInput').value;

            localStorage.setItem('my_gh_token', token);
            localStorage.setItem('my_gist_id', id);

            try {
                await fetch(`https://api.github.com/gists/${id}`, {
                    method: 'PATCH',
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ files: { "salidas.txt": { content: text } } })
                });
                alert("¡Guardado en tu propio servidor!");
                loadFromMyServer();
                closeModal('editNoteModal');
            } catch (e) { alert("Error de configuración"); }
        }

        function checkPinForEdit() {
            if(prompt("PIN:") === PIN_SEGURIDAD) openModal('editNoteModal');
        }
        
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function switchTab(id) { /* Función de cambio de pestaña igual a anteriores */ }
    </script>
</body>
</html>
