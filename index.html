<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Logística Pro - Versión Original</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --border: #d1d5db; --input-bg: #ffffff; }
        .dark { --bg: #111827; --card: #1f2937; --text: #f9fafb; --border: #4b5563; --input-bg: #374151; }
        
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; padding-top: 10px; transition: background 0.3s; }
        .tab-content { display: none; height: calc(100vh - 100px); overflow-y: auto; padding: 15px; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); z-index: 50; }
        .nav-item { text-align: center; font-size: 10px; color: #9ca3af; flex: 1; }
        .nav-item.active { color: #2563eb; }
        
        textarea, input, select { background-color: var(--input-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; outline: none; resize: none; width: 100%; border-radius: 10px; }
        .tipo-camion { border: 2px solid #ef4444 !important; background: #fee2e2 !important; color: #b91c1c !important; }
        .dark .tipo-camion { background: #450a0a !important; color: #fca5a5 !important; }
        .badge-last { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body onclick="activarAudioSilent()">

    <div id="tab1" class="tab-content">
        <h2 class="font-bold mb-3 text-blue-500 uppercase text-xs text-center">Bloc de Notas</h2>
        <textarea id="notas-input" class="w-full h-[70vh] p-4 text-sm" placeholder="Escribe aquí..."></textarea>
    </div>

    <div id="tab2" class="tab-content active">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <div>
                    <h2 class="font-bold text-blue-600">Base Grupal</h2>
                    <span id="cloud-status" class="text-[9px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold">ONLINE</span>
                </div>
                <button onclick="fetchCloudData()" class="bg-gray-100 dark:bg-gray-700 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
            <button id="btn-cloud" onclick="updateCloudData()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition-all active:scale-95">GUARDAR NUBE</button>
        </div>
        <textarea id="base-editable" class="w-full h-[65vh] p-3 font-mono text-sm" placeholder="Sincronizando..."></textarea>
    </div>

    <div id="tab3" class="tab-content">
        <h2 class="font-bold mb-4 text-center uppercase text-xs text-gray-400">Configuración</h2>
        <div class="flex gap-2 mb-6">
            <input id="input-ruta" type="text" placeholder="Nueva Ruta" class="flex-1 p-3 rounded-xl font-bold">
            <button onclick="addRuta()" class="bg-green-600 text-white px-6 rounded-xl font-bold">+</button>
        </div>
        <div class="flex items-center justify-between p-4 card mb-6">
            <span class="text-sm font-bold uppercase">Modo Nocturno</span>
            <input type="checkbox" id="dark-toggle" onchange="toggleDarkMode()" class="w-6 h-6">
        </div>
        <div id="lista-rutas-config"></div>
    </div>

    <div id="tab4" class="tab-content">
        <div id="panel-tiempos"></div>
    </div>

    <div id="tab5" class="tab-content">
        <div class="flex flex-col gap-3 mb-6">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-blue-600 uppercase text-xs">Historial</h2>
                <button onclick="copyWA()" class="bg-green-500 text-white px-3 py-1 rounded-lg text-[10px] font-bold">WhatsApp</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="date" id="calendar-filter" onchange="renderReportes()" class="p-2 rounded-xl text-xs font-bold bg-white">
                <select id="ruta-filter" onchange="renderReportes()" class="p-2 rounded-xl text-xs font-bold bg-white"></select>
            </div>
        </div>
        <div id="lista-reportes" class="space-y-2 mb-20"></div>
    </div>

    <nav class="nav-bottom">
        <div class="nav-item" onclick="go(1)"><i class="fas fa-edit fa-lg"></i><div>Notas</div></div>
        <div class="nav-item active" onclick="go(2)"><i class="fas fa-cloud fa-lg"></i><div>Base</div></div>
        <div class="nav-item" onclick="go(3)"><i class="fas fa-tools fa-lg"></i><div>Ajustes</div></div>
        <div class="nav-item" onclick="go(4)"><i class="fas fa-stopwatch fa-lg"></i><div>Tiempos</div></div>
        <div class="nav-item" onclick="go(5)"><i class="fas fa-list-ul fa-lg"></i><div>Reporte</div></div>
    </nav>

    <script>
        const BIN_ID = "69fa0670aaba882197744c88";
        const API_KEY = "$2a$10$iAE2V218BgWDZNqkKfpzGerowanmBp/6LMaYXswcLoRcKf9RffLH2";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioHabilitado = false;
        function activarAudioSilent() { if (!audioHabilitado) audioCtx.resume().then(() => audioHabilitado = true); }

        function sonarPatronAlarma() {
            if (!audioHabilitado) return;
            const ahora = audioCtx.currentTime;
            for(let i=0; i<4; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(1100, ahora + (i*0.25));
                gain.gain.setValueAtTime(0, ahora + (i*0.25));
                gain.gain.linearRampToValueAtTime(0.5, ahora + (i*0.25) + 0.05);
                gain.gain.linearRampToValueAtTime(0, ahora + (i*0.25) + 0.2);
                osc.start(ahora + (i*0.25)); osc.stop(ahora + (i*0.25) + 0.2);
            }
        }

        let rutas = JSON.parse(localStorage.getItem('rutas_v41')) || [];
        let historial = JSON.parse(localStorage.getItem('historial_v41')) || {};
        let tabActual = 2;

        async function fetchCloudData() {
            const status = document.getElementById('cloud-status');
            status.innerText = "BUSCANDO...";
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": API_KEY, "X-Bin-Meta": "false" }
                });
                const data = await res.json();
                document.getElementById('base-editable').value = data.contenido || "";
                status.innerText = "CONECTADO";
            } catch (e) { status.innerText = "ERROR RED"; }
        }

        async function updateCloudData() {
            const btn = document.getElementById('btn-cloud');
            const texto = document.getElementById('base-editable').value;
            btn.disabled = true; btn.innerText = "GUARDANDO...";
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify({ contenido: texto })
                });
                if (res.ok) {
                    btn.innerText = "✓ GUARDADO";
                    btn.style.backgroundColor = "#10b981";
                }
            } catch (e) { btn.innerText = "ERROR"; }
            finally { setTimeout(() => { btn.disabled = false; btn.innerText = "GUARDAR NUBE"; btn.style.backgroundColor = ""; }, 2000); }
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('tema_oscuro', isDark);
        }

        function getFechaLocal() { return new Date().toISOString().split('T')[0]; }

        function go(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab'+t).classList.add('active');
            document.querySelectorAll('.nav-item')[t-1].classList.add('active');
            tabActual = t;
        }

        function save() {
            localStorage.setItem('rutas_v41', JSON.stringify(rutas));
            localStorage.setItem('historial_v41', JSON.stringify(historial));
            render();
        }

        function regPase(idx) {
            let unidad = document.getElementById(`unit-${idx}`).value;
            let tipo = document.getElementById(`tipo-${idx}`).value;
            if(!unidad) return;
            const hoy = getFechaLocal();
            if(!historial[hoy]) historial[hoy] = [];
            historial[hoy].push({ ruta: rutas[idx].n, unidad, tipo, time: Date.now() });
            save(); document.getElementById(`unit-${idx}`).value = '';
        }

        function render() {
            actualizarSelectorRutas();
            document.getElementById('lista-rutas-config').innerHTML = rutas.map((r,i) => `
                <div class="card flex flex-col gap-2">
                    <div class="flex justify-between font-bold text-blue-600"><span>${r.n}</span><button onclick="rutas.splice(${i},1);save()" class="text-red-400"><i class="fas fa-trash-alt"></i></button></div>
                    <div class="flex items-center gap-3 text-xs">Alarma: <input type="number" value="${r.alarm}" onchange="rutas[${i}].alarm=this.value;save()" class="w-12 border rounded text-center font-bold"> min
                    <button onclick="rutas[${i}].on=!rutas[${i}].on;save()" class="ml-auto text-lg ${r.on?'text-blue-500':'text-gray-300'}"><i class="fas ${r.on?'fa-bell':'fa-bell-slash'}"></i></button></div>
                </div>
            `).join('');

            document.getElementById('panel-tiempos').innerHTML = rutas.map((r,i) => {
                let regsRuta = (historial[getFechaLocal()] || []).filter(x => x.ruta === r.n);
                let last = regsRuta[regsRuta.length - 1];
                let css = (last && last.tipo === 'Camión') ? 'tipo-camion' : '';
                return `
                    <div class="card ${css}">
                        <div class="flex justify-between items-start mb-4">
                            <div><span class="font-black text-xl uppercase">${r.n}</span>
                            ${last ? `<div class="mt-1"><span class="badge-last">#${last.unidad}</span></div>` : ''}</div>
                            <span class="cronos font-mono text-3xl font-black" data-last="${last?last.time:''}" data-alarm="${r.alarm}" data-on="${r.on}">--:--</span>
                        </div>
                        <div class="flex gap-2">
                            <input id="unit-${i}" type="number" placeholder="ID" class="w-20 p-3 rounded-xl font-bold">
                            <select id="tipo-${i}" class="flex-1 p-3 rounded-xl text-xs font-bold"><option>Combi</option><option>Camión</option></select>
                            <button onclick="regPase(${i})" class="bg-blue-600 text-white px-6 rounded-xl font-bold">OK</button>
                        </div>
                    </div>
                `;
            }).join('');
            renderReportes();
        }

        function renderReportes() {
            const fecha = document.getElementById('calendar-filter').value;
            const rutaSel = document.getElementById('ruta-filter').value;
            const regs = (historial[fecha] || []).filter(r => r.ruta === rutaSel);
            let h = regs.length > 0 ? `<div class="mb-4 text-center font-black text-blue-600 text-xs">${rutaSel}</div>` : '';
            regs.slice().reverse().forEach((r) => {
                h += `<div class="card p-4 flex justify-between items-center text-[11px]">
                    <div><span class="font-black text-blue-600 text-sm">#${r.unidad}</span> | <b>${new Date(r.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</b></div>
                    <div class="opacity-50 font-bold">${r.tipo}</div>
                </div>`;
            });
            document.getElementById('lista-reportes').innerHTML = h || `<p class='text-center opacity-30 mt-20 text-xs font-bold'>SIN DATOS</p>`;
        }

        function tick() {
            document.querySelectorAll('.cronos').forEach(el => {
                let last = el.dataset.last; if(!last) { el.innerText = "00:00"; return; }
                let diff = Math.floor((Date.now() - last)/1000);
                let m = Math.floor(diff/60); let s = diff % 60;
                el.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(el.dataset.on === 'true' && m >= el.dataset.alarm) {
                    el.style.color = '#ef4444'; if (s === 0) sonarPatronAlarma();
                } else { el.style.color = ''; }
            });
            setTimeout(tick, 1000);
        }

        function addRuta() {
            let n = document.getElementById('input-ruta').value;
            if(n) { rutas.push({n: n.toUpperCase(), alarm: 15, on: true}); save(); document.getElementById('input-ruta').value=''; }
        }

        function actualizarSelectorRutas() {
            const sel = document.getElementById('ruta-filter');
            const actual = sel.value;
            sel.innerHTML = rutas.map(r => `<option value="${r.n}">${r.n}</option>`).join('');
            if (actual) sel.value = actual;
        }

        function copyWA() {
            const fecha = document.getElementById('calendar-filter').value;
            const rutaSel = document.getElementById('ruta-filter').value;
            const regs = (historial[fecha] || []).filter(r => r.ruta === rutaSel);
            if(regs.length === 0) return alert("No hay datos");
            let txt = `📋 REPORTE: ${rutaSel}\n📅 FECHA: ${fecha}\n\n`;
            regs.forEach(r => txt += `• #${r.unidad} - ${new Date(r.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} (${r.tipo})\n`);
            navigator.clipboard.writeText(txt).then(() => alert("Copiado para WhatsApp"));
        }

        document.getElementById('notas-input').oninput = (e) => localStorage.setItem('notas_v41', e.target.value);
        
        function init() {
            const hoy = getFechaLocal();
            if (!historial[hoy]) historial[hoy] = [];
            document.getElementById('calendar-filter').value = hoy;
            document.getElementById('notas-input').value = localStorage.getItem('notas_v41') || '';
            if (localStorage.getItem('tema_oscuro') === 'true') {
                document.body.classList.add('dark');
                document.getElementById('dark-toggle').checked = true;
            }
            fetchCloudData(); render(); tick();
        }

        init();
    </script>
</body>
</html>
